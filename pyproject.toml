[project]
name = "avakas"
version = "3.0.10"
description = "Interact with project version metadata"
license = "MIT"
authors = [
    {name = "Jonathan Freedman", email = "jonafree@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "semantic_version==2.10.0",
    "gitpython==3.1.54",
    "tomlkit",
]

[project.urls]
Homepage = "https://github.com/otakup0pe/avakas"

[project.scripts]
avakas = "avakas.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["avakas", "avakas.flavors"]
