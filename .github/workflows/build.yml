---
name: "build"

on:
  push:
    branches:
      - "mainline"
  pull_request:
    branches:
      - "mainline"

permissions:
  contents: read

jobs:
  test:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - name: "Set up Python ${{ matrix.python-version }}"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
      - name: "Config git"
        run: "git config init.defaultbranch mainline"
      - name: "run tests"
        run: "make test"
      - name: "build container"
        if: matrix.python-version == '3.12'
        uses: "docker/build-push-action@v6"
        with:
          context: "."
          push: false
          tags: "otakup0pe/avakas:test"
  maybe_bump:
    if: ${{ github.ref == 'refs/heads/mainline' && github.event_name == 'push' && ! startsWith(github.event.head_commit.message, 'Version bumped to')}}
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    needs: "test"
    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 0
      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "dat env tho"
        run: "make testenv"
      - name: "Maybe bump version"
        run: |
            git config user.email "sysop@eghetto.ca"
            git config user.name "An Automaton"
            mkdir -p ~/.ssh/
            make install
            git remote set-url origin "$(git config --get remote.origin.url | sed 's#http.*com/#git@github.com:#g')"
            eval `ssh-agent -t 300 -s`
            ssh-add - <<< "${{secrets.DEPLOY_KEY}}"
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            avakas bump . auto --branch=mainline --default-bump patch --flavor "pep621"
            ssh-agent -k
      - name: "Maybe create release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
            version=$(avakas show . --flavor "pep621")
            if [ -z "$version" ]; then
              echo "No version found, skipping release"
              exit 0
            fi
            if ! git ls-remote --tags origin "$version" | grep -q "$version"; then
              echo "Tag $version not found on remote, skipping release"
              exit 0
            fi
            if gh release view "$version" > /dev/null 2>&1; then
              echo "Release $version already exists, skipping"
              exit 0
            fi
            echo "Creating release $version"
            gh release create "$version" --title "$version" --notes "Release $version"
